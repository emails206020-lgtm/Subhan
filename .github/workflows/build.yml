name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install buildozer and cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==3.0.11

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache buildozer project directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ hashFiles('buildozer.spec') }}

      # المحاولة الأولى: قد تفشل بسبب خطأ grpmodule.c المعروف
      # (NDK الحديث لا يوفر getgrent/setgrent/endgrent، وPython's configure
      # لا يتحقق من هذا فيسمح ببناء وحدة grp رغم غيابها، فيفشل clang الصارم)
      - name: First build attempt (may fail on grpmodule.c)
        continue-on-error: true
        id: first_attempt
        run: |
          yes | buildozer android debug

      # إذا فشلت المحاولة الأولى، نصحح ملف grpmodule.c المصدري مباشرة
      # بإضافة تعريفات بديلة للدوال المفقودة، ثم نعيد المحاولة
      - name: Patch grpmodule.c if needed and retry
        if: steps.first_attempt.outcome == 'failure'
        run: |
          GRP_FILE=$(find .buildozer -path "*/Modules/grpmodule.c" 2>/dev/null | head -1)
          if [ -n "$GRP_FILE" ]; then
            echo "تم إيجاد الملف: $GRP_FILE"
            echo "تصحيح grpmodule.c بإضافة grp.h..."
            # نتأكد أن grp.h مُضمَّن، وهو يحتوي تعريفات هذه الدوال في بعض بيئات NDK
            sed -i '1i #include <grp.h>' "$GRP_FILE"
            # كحل احتياطي إضافي: نعطل استدعاءات الدوال غير المتوفرة بالكامل
            sed -i 's/setgrent();/;/' "$GRP_FILE"
            sed -i 's/endgrent();/;/' "$GRP_FILE"
            echo "أعيد محاولة البناء..."
            yes | buildozer android debug
          else
            echo "لم يُعثر على grpmodule.c، الفشل لسبب آخر - عرض آخر جزء من السجل:"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: subhan-app-apk
          path: bin/*.apk
